name: CI

on:
  push:
  pull_request:

jobs:
  macos:
    runs-on: macos-15

    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Install CocoaPods
        run: sudo gem install cocoapods --no-document

      - name: Install dependencies
        run: pod install

      - name: Run tests
        run: bash unit-tests.sh

      - name: Build app
        run: bash build.sh

      - name: Build installer package
        run: bash package/build-package.bash
